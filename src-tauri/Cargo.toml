[package]
name = "your-commander"
version = "0.13.9"
edition = "2024"

[lib]
name = "your_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
drag = "2.1.1"
flate2 = "1.1.10"
libc = "0.2"
notify = "8.2.0"
open = "5.4.5"
russh = "0.64.1"
russh-sftp = "3.0.1"
sevenz-rust2 = "0.24.1"
ssh2-config = "0.9.0"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
toml = "1.1.8"
ureq = "2.10"
trash = "5.2.9"
urlencoding = "2.1.3"
xattr = "1"
zip = "9.0.5"

# Platform credential stores: Keychain on macOS, Secret Service
# (GNOME Keyring / KWallet over D-Bus) on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
freedesktop-icons = "0.4"
mime_guess = "2"
