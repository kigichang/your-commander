[package]
name = "your-commander"
version = "0.4.0"
edition = "2024"

[lib]
name = "your_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
core-foundation = "0.10"
dirs = "7.0.0"
flate2 = "1.1.10"
libc = "0.2"
notify = "8.2.0"
objc2 = "0.6"
open = "5.4.5"
russh = "0.64.1"
russh-sftp = "3.0.1"
security-framework = "3.7.0"
sevenz-rust2 = "0.24.1"
ssh2-config = "0.9.0"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
toml = "1.1.8"
ureq = "2.10"
trash = "5.2.9"
urlencoding = "2.1.3"
zip = "9.0.5"
