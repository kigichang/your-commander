name: CI

on:
  push:
    branches: [main, linux-support]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Backend tests
        run: cargo test
        working-directory: src-tauri
      - name: Frontend build
        run: |
          npm ci
          npm run build

  # amd64 .deb on tags and manual runs (the test jobs stay fast).
  linux-deb:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build .deb
        run: |
          npm ci
          npx tauri build -b deb
      - uses: actions/upload-artifact@v4
        with:
          name: your-commander-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Backend tests
        run: cargo test
        working-directory: src-tauri
      - name: Frontend build
        run: |
          npm ci
          npm run build
